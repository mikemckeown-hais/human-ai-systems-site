<!DOCTYPE html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Business AI Operating System Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header with lens tabs; 3D campus stage left; reading panel right (bottom sheet on phones).
   Single committed dark look, from the HAS design system's dashboard theme. */
:root {
  color-scheme: dark;
  --bg: #0A0F1A;
  --panel: #131B2B;
  --panel-2: #182236;
  --line: rgba(255,255,255,0.08);
  --line-2: rgba(255,255,255,0.14);
  --ink: #C7D2E4;
  --heading: #EEF3FA;
  --muted: #93A7C6;
  --accent: #4FBEC4;
  --aqua: #3EC1C9;
  --aqua-soft: #72D0D5;
  --fill: #36527A;
  --fill-hover: #2A6F74;
  --tint: rgba(62,193,201,0.16);
  --warn: #F0AB3D;
  --crit: #F2687A;
  --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", Calibri, Arial, sans-serif;
  --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua-soft); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--heading); letter-spacing: 0.01em; }
.mark { position: relative; width: 26px; height: 18px; }
.mark i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--aqua); top: 4px; left: 0; }
.mark i + i { left: 15px; top: 0; background: var(--aqua-soft); }
.mark::before { content: ""; position: absolute; left: 5px; top: 7px; width: 14px; height: 2px; background: var(--muted); transform: rotate(-16deg); transform-origin: left; }
.brand .logo { height: 50px; width: auto; flex: none; }
.brand .title { color: var(--heading); font-weight: 600; font-size: 16px; padding-left: 12px; border-left: 1px solid var(--line-2); line-height: 1.2; }

.lenses { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; overflow-x: auto; max-width: 100%; }
.lenses button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.lenses button:hover { color: var(--heading); }
.lenses button[aria-selected="true"] { background: var(--fill); color: #fff; }
.lenses em { font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn); border: 1px solid rgba(240,171,61,0.4); border-radius: 999px; padding: 0 6px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 410px; gap: 12px; }
.stage { position: relative; min-width: 0; min-height: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 40%, #12203a 0%, #0A0F1A 70%); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -100%); z-index: 1; pointer-events: auto; border: 1px solid var(--line-2); background: rgba(19,27,43,0.86);
  color: var(--heading); font-weight: 600; font-size: 14px; padding: 4px 11px 5px; border-radius: 999px; white-space: nowrap;
  transition: opacity .3s, background .2s, border-color .2s; backdrop-filter: blur(4px); }
.lbl:hover, .lbl.hover { border-color: var(--aqua); }
.lbl.on { background: var(--aqua); color: #08202a; border-color: var(--aqua); }
.lbl.dim { opacity: 0.25; }
.lbl.sub { z-index: 2; font-size: 12px; font-weight: 600; padding: 2px 8px 3px; color: var(--ink); background: rgba(10,15,26,0.8); }
.lbl.sub.later { color: var(--muted); border-style: dashed; }
.lbl.sub.side { transform: translate(calc(-100% - 16px), -50%); }
.lbl.sub.role { border-color: rgba(79,190,196,0.6); }
.lbl.pulse { pointer-events: none; font-family: var(--mono); font-size: 12px; font-weight: 500; color: #08202a; background: var(--aqua-soft); border-color: var(--aqua-soft); }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.leader { stroke: rgba(199,210,228,0.4); stroke-width: 1.2; stroke-dasharray: 3 3; transition: opacity .3s; }
.pin { fill: #C7D2E4; opacity: 0.8; transition: opacity .3s; }
.leader.on { stroke: var(--aqua); stroke-dasharray: none; stroke-width: 1.6; }
.pin.on { fill: var(--aqua); opacity: 1; }
.leader.dim, .pin.dim { opacity: 0.2; }
.lbl.faint { opacity: 0.1 !important; }
.lbl.quiet { opacity: 0.3; }
.lbl.sub.you { background: #E0A458; border-color: #E0A458; color: #1a1208; font-weight: 700; z-index: 3; }
.seg.ww button[data-wmode="without"][aria-selected="true"] { background: #6b4a2a; color: #FFE2A8; }
.eyebrow.warn { color: #F0AB3D; }
.lbl.sub.you.has { background: #2A6F74; border-color: #4FBEC4; color: #fff; }
.seg .sm { display: none; }
.leader.quiet, .pin.quiet { opacity: 0.2; }
.leader.faint, .pin.faint { opacity: 0.06 !important; }

.stage-ui { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); background: rgba(10,15,26,0.6); padding: 4px 10px; border-radius: 999px; }
.stage-btns { display: flex; gap: 6px; pointer-events: auto; }
.btn { border: 1px solid var(--line-2); background: rgba(19,27,43,0.9); color: var(--heading); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--aqua); }
.btn.primary { background: var(--fill); border-color: var(--fill); color: #fff; }
.btn.primary:hover { background: var(--fill-hover); border-color: var(--fill-hover); }
.btn .tri { width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }

.tourbar { position: absolute; z-index: 6; left: 12px; right: 12px; bottom: 12px; background: rgba(10,15,26,0.92); border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 12px 8px; display: grid; gap: 6px; backdrop-filter: blur(6px); }
.tourbar p { margin: 0; color: var(--heading); font-size: 17px; line-height: 1.4; max-width: 68ch; text-wrap: pretty; }
.tourbar.nocap p { display: none; }
.tour-row { display: flex; align-items: center; gap: 6px; }
.tour-step { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; margin: 0 4px; }
.tour-prog { flex: 1; min-width: 40px; height: 3px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.tour-prog i { display: block; height: 100%; width: 0; background: var(--aqua); }
.ibtn { flex: none; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(19,27,43,0.9); color: var(--heading); }
.ibtn:hover { border-color: var(--aqua); }
.ibtn svg { width: 16px; height: 16px; fill: currentColor; }
.ibtn.big { width: 38px; height: 38px; background: var(--fill); border-color: var(--fill); }
.ibtn.big svg { width: 18px; height: 18px; }
.ibtn[aria-pressed="true"] { color: var(--muted); }
.ibtn .cc { font: 700 11px var(--sans); letter-spacing: 0.02em; }
.ibtn[aria-pressed="true"] .cc { text-decoration: line-through; }
.ai-tag { flex: none; font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 8px; white-space: nowrap; cursor: help; }
.stage.touring .lensbar { display: none; }
.stage.touring.has-bar .tourbar { bottom: 12px; }
.lensbar, .stage-ui { z-index: 5; }
@media (max-height: 820px) { .tourbar p { font-size: 15px; line-height: 1.35; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow-y: auto; padding: 24px 26px 28px; min-width: 0; }
.panel > * + * { margin-top: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; }
.crumbs button:hover { text-decoration: underline; }
.depth { display: flex; align-items: center; gap: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.depth i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.depth i.f { background: var(--aqua); border-color: var(--aqua); }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--accent); }
h1, h2, h3 { color: var(--heading); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 29px; line-height: 1.12; }
h2 { font-size: 28px; line-height: 1.12; }
h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.panel :where(p, ul, ol, h1, h2, h3) { margin: 0; }
[hidden] { display: none !important; }
.lead { font-size: 18px; color: var(--ink); }
.panel ul { padding: 0; list-style: none; display: grid; gap: 8px; }
.ticks li { position: relative; padding-left: 22px; }
.ticks li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--aqua); }
.inmodel { background: var(--tint); border-radius: 12px; padding: 12px 14px; font-size: 15px; color: var(--heading); display: flex; gap: 10px; }
.inmodel b { color: var(--aqua-soft); white-space: nowrap; font-weight: 600; }
.grp { margin-top: 20px; }
.grp + .grp { margin-top: 14px; }
.parts { display: grid; gap: 6px; margin-top: 8px; }
.part { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.part:hover, .part.hover { border-color: var(--aqua); }
.part .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--aqua); }
.part strong { display: block; color: var(--heading); font-weight: 600; }
.part span { display: block; font-size: 14px; color: var(--muted); }
.part .go { color: var(--accent); font-size: 18px; }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.outcomes div { background: var(--panel-2); border-radius: 12px; padding: 12px; font-weight: 600; color: var(--heading); font-size: 15px; line-height: 1.3; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pager { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 22px !important; }
.pager button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; font-size: 15px; }
.pager button:hover { text-decoration: underline; }
.pager button[disabled] { visibility: hidden; }
.sec { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px !important; display: grid; gap: 8px; }
details { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
details + details { margin-top: 6px; }
summary { cursor: pointer; color: var(--heading); font-weight: 600; }
details p { margin-top: 6px !important; color: var(--ink); }
.cta { background: linear-gradient(135deg, #1F3A5F, #2A6F74); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; margin-top: 22px !important; }
.cta p { color: #fff; font-weight: 600; font-size: 17px; }
.cta a { color: #fff; font-weight: 600; justify-self: start; background: rgba(255,255,255,0.14); padding: 6px 14px; border-radius: 999px; text-decoration: none; }
.cta a:hover { background: rgba(255,255,255,0.24); }
.foot { font-size: 13px; color: var(--muted); }
.stages { counter-reset: s; }
.stages li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.stages li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--aqua); color: var(--aqua-soft); font-weight: 600; font-size: 14px; }
.stages strong { color: var(--heading); }
.soon { display: inline-block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn); border: 1px solid rgba(240,171,61,0.45); border-radius: 999px; padding: 1px 8px; font-weight: 600; }

.lensbar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: rgba(10,15,26,0.86); border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 14px; backdrop-filter: blur(6px); }
.stage.has-bar .tourbar { bottom: 96px; }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--panel-2); border-radius: 999px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.seg button:hover { color: var(--heading); }
.seg button[aria-selected="true"] { background: var(--fill); color: #fff; }
.track { position: relative; flex: 1; min-width: 240px; height: 44px; margin-inline: 22px; }
.rail { position: absolute; left: -12px; right: -12px; top: 22px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #4a5a86, #F0AB3D 18%, #FFE2A8 50%, #F0AB3D 82%, #4a5a86); opacity: 0.65; }
.tick { position: absolute; top: 34px; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; color: var(--muted); }
.sunmark { position: absolute; top: 17px; width: 13px; height: 13px; border-radius: 50%; background: #FFE2A8; box-shadow: 0 0 12px 4px rgba(255,210,140,0.55); transform: translateX(-50%); pointer-events: none; }
.stop { position: absolute; top: 12px; transform: translateX(-50%); border: 0; background: none; padding: 0; z-index: 1; }
.stop span { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--heading); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 7px; }
.stop:hover span { border-color: var(--aqua); }
.stop.on span { background: var(--aqua); border-color: var(--aqua); color: #08202a; }
.deptchips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.deptchips button, .dept, .chip { border: 1px solid var(--line-2); background: var(--panel-2); color: var(--heading); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.deptchips button:hover, .dept:hover, .chip:hover { border-color: var(--aqua); }
.deptchips button.on { background: var(--aqua); border-color: var(--aqua); color: #08202a; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex: 1; min-width: 0; overflow-x: auto; }
.stepper li { flex: 1; position: relative; display: flex; justify-content: center; min-width: 78px; }
.stepper li + li::before { content: ""; position: absolute; left: -50%; right: 50%; top: 15px; height: 2px; background: var(--line-2); }
.stepper li.done::before, .stepper li.on::before { background: var(--aqua); }
.stepper button { position: relative; z-index: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; font-size: 13px; padding: 0; }
.stepper .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1.5px solid var(--line-2); color: var(--heading); }
.stepper button:hover .num { border-color: var(--aqua); }
.stepper li.done .num { border-color: var(--aqua); color: var(--aqua-soft); }
.stepper li.on .num { background: var(--aqua); border-color: var(--aqua); color: #08202a; }
.stepper li.on .nm { color: var(--heading); }
.gain { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; font-size: 16px; color: var(--heading); }
.gain b { color: #FFE2A8; white-space: nowrap; font-weight: 600; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.compare > div { background: var(--panel-2); border-radius: 12px; padding: 12px; }
.compare b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
.compare .with { background: var(--tint); }
.compare .with b { color: var(--aqua-soft); }
.chips, .depts { display: flex; flex-wrap: wrap; gap: 6px; }
.depts { margin-top: 10px; }
.dept { font-size: 14px; padding: 7px 14px; }
.grp > p { margin-top: 6px; }
.parts.day .part { grid-template-columns: 50px 1fr auto; }
.parts.steps { list-style: none; padding: 0; }
.parts.steps .part { grid-template-columns: 28px 1fr auto; }
.part .time { display: block; font-family: var(--mono); font-size: 13px; color: var(--aqua-soft); }
.part .num { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--aqua); color: var(--aqua-soft); font-weight: 600; font-size: 14px; }

@media (max-width: 860px) {
  .main { grid-template-rows: minmax(330px, 62%) minmax(0, 1fr) !important; }
  .lensbar { left: 8px; right: 8px; bottom: 8px; padding: 6px 8px; gap: 6px 8px; border-radius: 12px; }
  .stage.has-bar .tourbar { bottom: 92px; }
  .seg .lg { display: none; }
  .seg .sm { display: inline; }
  .seg button { font-size: 12px; padding: 4px 10px; }
  .track { flex: 1 0 100%; min-width: 0; height: 30px; margin-inline: 16px; }
  .rail { top: 14px; }
  .sunmark { top: 10px; width: 11px; height: 11px; }
  .stop { top: 6px; }
  .stop span { font-size: 9.5px; padding: 1px 4px; }
  .deptchips { gap: 4px; }
  .deptchips button { font-size: 11.5px; padding: 3px 8px; }
  .stepper li { min-width: 56px; }
  .stepper .num { width: 24px; height: 24px; font-size: 12px; }
  .stepper .nm { font-size: 11px; }
  .stepper li + li::before { top: 12px; }
  .stage-ui { left: 8px; right: 8px; top: 8px; }
  .stage-btns .btn { font-size: 13px; padding: 5px 10px; }
  .lenses button { font-size: 14px; padding: 6px 11px; }
  .tourbar p { font-size: 14px; }
  .tour-row { flex-wrap: wrap; row-gap: 6px; }
  .tour-prog { flex-basis: 100%; order: -1; }
  .ai-tag { display: none; }
  .ibtn { width: 30px; height: 30px; } .ibtn.big { width: 34px; height: 34px; }
  .compare { grid-template-columns: minmax(0,1fr); }
  .main { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(260px, 52%) minmax(0, 1fr); }
  .panel { padding: 18px 18px 22px; }
  h1 { font-size: 25px; } h2 { font-size: 24px; }
  .hint { display: none; }
  .outcomes { grid-template-columns: minmax(0,1fr); }
  .brand .title { font-size: 14px; }
  .track .tick { display: none; }
  .tourbar p { font-size: 15px; }
  .lbl { font-size: 12px; padding: 3px 8px 4px; }
  .lbl.sub { z-index: 2; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span id="brandLogo"></span><span class="title" id="brandTitle"></span></div>
    <nav class="lenses" role="tablist" aria-label="Choose a view">
      <button role="tab" id="lens-benefits" data-lens="benefits" aria-selected="true"></button>
      <button role="tab" id="lens-what" data-lens="what" aria-selected="false"></button>
      <button role="tab" id="lens-how" data-lens="how" aria-selected="false"></button>
    </nav>
  </header>
  <main class="main">
    <section class="stage" id="stage" aria-label="3D model of a Business AI Operating System">
      <canvas id="gl"></canvas>
      <svg class="leaders" id="leaders" aria-hidden="true"></svg>
      <div class="labels" id="labels"></div>
      <div class="stage-ui">
        <div class="hint">Drag to turn · Scroll to zoom · Click any part</div>
        <div class="stage-btns">
          <button class="btn primary" id="tourBtn"><span class="tri" aria-hidden="true"></span><span id="tourBtnText"></span></button>
          <button class="btn" id="resetBtn">Reset view</button>
        </div>
      </div>
      <div class="tourbar" id="tourbar" hidden>
        <p id="tourText"></p>

.345 99.5Q154.518 100.112 155.24900000000002 101.047Q155.98000000000002 101.982 155.98000000000002 103.478Q155.98000000000002 104.804 155.28300000000002 105.926Q154.586 107.048 153.243 107.72800000000001Q151.9 108.408 149.928 108.408Z\"/><\/g><\/g><\/svg>", "consultantTag": "Human-AI Systems", "cta": {"text": "Human-AI Systems builds your operating system with you, on the platform you already use, then trains your team to run it and keep improving it.", "label": "Find out what yours could do", "url": "https://human-ai-systems.com/start/"}, "footPrefix": "Interactive prototype v1.8"}, "lenses": {"order": ["benefits", "what", "how"], "start": "benefits", "labels": {"benefits": "What it does for you", "what": "What it is", "how": "How you get one"}, "play": {"benefits": "Play the day", "what": "Take the tour", "how": "Play the journey"}, "chainTours": false}, "what": {"intro": {"eyebrow": "What is a Business AIOS", "h1": "The AI you already use, set up to work like part of your team", "lead": "Most people open a chat, explain the background, get a decent answer and close the tab. Tomorrow they start again. The AI is capable enough. It just knows nothing about your business.", "sub": "A Business AI Operating System fixes that. Explore the model, or pick a part below."}, "outcomes": ["Hours back every week", "A team working from the same picture", "AI use you can see and control"], "parts": {"team": {"name": "You and your team", "tag": "Who it works for", "short": "You and your team use the system through one app, on your PC or Mac and on your phone. The same knowledge, skills and dashboards are there wherever you are.", "points": ["One app, on PC, Mac and mobile", "Each person has their own space, plus the shared team layer", "People stay in charge: they review, decide and send"], "model": "The people stand outside the platform, each on their own device, connected into it. What they see comes from everything inside.", "how": "Each person works through the AI platform's own app, on the desktop and on the phone. They sign in with their own account, so the system knows who they are, what they work on and what they're allowed to see.", "examples": ["Reading the morning brief on the phone before the first meeting", "Recording an in-person meeting on the phone for the write-up", "Building a proposal at the desk with the proposal skill", "Asking a question of the knowledge base from anywhere"], "control": "Each person sees what their permissions allow. Anything that goes out of the business is checked and sent by a person.", "faq": [["Do people need new equipment?", "No. It runs in the platform's desktop app on a PC or Mac, and in the mobile app on a phone."], ["Is it one system for the team, or one each?", "Both. The team shares a knowledge base and common skills, and each person has their own space and skills built around their role."]]}, "platform": {"name": "Your AI platform", "tag": "The ground it stands on", "short": "A Business AIOS isn't new software. It's a way of setting up the AI you already use, on Claude Cowork, ChatGPT for Work or Microsoft Copilot 365, so it works like part of your team.", "points": ["Built on the platform you already pay for", "Nothing new for your team to learn from scratch", "Gets better as the platform improves"], "model": "The platform is the base slab, with the three platforms named along its edge. Everything else is built on top of it.", "how": "We set up the platform's own features, such as projects, instructions, skills, scheduled tasks and connectors, in one consistent structure. Nothing is hidden in a proprietary layer, so your team can see how it works and change it.", "examples": ["Claude Cowork, with projects, skills and scheduled tasks", "ChatGPT for Work, with projects, custom GPTs and connectors", "Microsoft Copilot 365, alongside the rest of Microsoft 365"], "control": "You hold the licences and the accounts. The knowledge base and the way of working live in your own files, so they come with you if you ever change platform.", "faq": [["Do we need to buy anything new?", "Usually not. Most organisations already have business licences for at least one of these platforms. If a different plan would pay for itself, we'll say so during discovery."], ["Which platform is best?", "The one your team already uses and your IT allows. The design is the same on each. Some features are further ahead on one platform than another, and we'll be clear about that."]]}, "knowledge": {"name": "Knowledge base", "tag": "What the system holds", "short": "The knowledge base has two parts. What it knows: your company, your team and how you like things done. What it records: the meetings, decisions, proposals and progress that build up as you work.", "points": ["What it knows: your company and market, your team, roles and processes, and your own style and priorities", "What it records: meetings and decisions, proposals, plans and campaigns, customers, tasks and progress", "Stored in your own SharePoint or Google Workspace"], "model": "The back half of the foundation is what it knows. The front half is what it records, and each tile that lights up there is a new record being filed as work gets done.", "how": "The knowledge base is a set of well-organised documents in your own cloud storage. What it knows is built at the start, from material you already have and from discovery. What it records grows every day, because the skills file their results back into it. Over time your organisation, your team and each person end up with something close to a working wiki, built as a by-product of doing the work.", "examples": ["Company, services, market and competitors", "Team structure, roles, processes and templates", "Each person's writing style and priorities", "Meeting notes and decisions, filed by account and date", "Proposals, plans and campaigns", "Customer histories, tasks and progress"], "control": "Your files stay on your own cloud drive, in SharePoint, OneDrive or Google Drive, and nothing passes through Human-AI Systems. Access follows your existing file permissions, so whoever can read a folder today is whoever can read it through the system.", "faq": [["Do we have to move our documents?", "No. The system can be pointed at the document libraries and shared drives you already have in SharePoint or Google Workspace, so they become part of what it knows."], ["How long does it take to build?", "The starting knowledge base is built in the first weeks, from documents you already have and a discovery session. From then on it grows as you work."], ["What happens when someone leaves?", "The knowledge stays, because it lives in the shared knowledge base rather than in one person's head or laptop. A new joiner inherits it on day one."]]}, "skills": {"name": "Skills / Agents", "tag": "The jobs it does", "short": "Skills, which many people call agents, are the jobs the system does for you. They work like members of your team: a standard set that every build includes, and others built around the work only you do.", "points": ["Standard set: knowledge management, meeting write-ups, the daily brief and task list", "Built around your role: the work that fills most of your week", "Yours, or shared with the team, and extended as you learn"], "model": "Each figure is a skill, or agent, at its own workstation. The blue ones are the standard set. The teal ones are built around your role. The outline is room for the ones you add yourself.", "how": "A skill is a written set of instructions for one job, in your standards and your format. It knows where to find the context it needs in the knowledge base and where to file the result. Some run when you ask, others run on a schedule.", "examples": ["Knowledge management: files new material in the right place", "Meeting write-up: notes, decisions, actions and a follow-up email draft", "Daily brief and task list: what's on today and what needs attention", "Proposal drafts from the account history and your pricing rules", "Board and monthly reports in your format"], "control": "Skills are plain text you can read. When something isn't right it's changed once and stays fixed, and your team learns to make those changes, and add new skills, themselves.", "faq": [["Are skills the same as agents?", "Close enough. Claude calls them skills and other platforms call them agents or custom GPTs. Each one is a specific job, done to your standards."], ["How many do we start with?", "The standard set, plus a few built around your highest-value work. More get added as you find them."]]}, "dashboards": {"name": "Dashboards", "tag": "What the system shows", "short": "Dashboards show what's on, what's slipping, and what to do about it.", "points": ["Standard set: morning brief, work in progress and system health", "Built for your function: the numbers you run on", "With the AI's read on them, and what to do next"], "model": "The screens stand on the platform, not on the knowledge base, because they draw on everything: the knowledge base, the skills and your connected systems. The red bar is a deal that's slipping and needs a decision.", "how": "Dashboards are pages the system refreshes from the knowledge base and your connected tools. Because the AI builds them, they can explain what changed and suggest what to do, rather than only showing a chart.", "examples": ["Morning brief: today's priorities at a glance", "Work in progress: tasks, deadlines and what's overdue", "Sales: deals at risk, with a suggested next step for each", "System health: what ran, and anything that needs attention"], "control": "You choose what's measured. Each figure points back to where it came from, so it can be checked.", "faq": [["Do we need a BI tool?", "No. If you already have one, these sit alongside it. Most small and mid-sized organisations find they cover what's needed day to day."]]}, "connectors": {"name": "Connectors", "tag": "What the system reaches", "short": "Your files, email and calendar are connected in every build. Most other internal and external systems can be connected too, as options, when you're ready.", "points": ["In every build: your files, email and calendar", "Optional: most internal and external systems, such as CRM, finance, project tools, team chat and HR", "Set up with you, or added by you once trained"], "model": "The pipes on the left are connected in every build. The pipes on the right are optional connections, and there are many more possible than the three shown.", "how": "Connectors let the AI read from the tools where your work already happens, using the platform's own approved integrations. We start with the essentials, then add the systems that matter to you once the basics are working well.", "examples": ["Files and documents: SharePoint, OneDrive, Google Drive, Box, Dropbox", "Email and calendar: Microsoft 365 or Google Workspace", "CRM: HubSpot, Salesforce, Attio and others", "Finance: Xero, QuickBooks, Sage", "Work tracking and chat: Asana, Jira, monday.com, Slack, Teams"], "control": "Each connector is switched on deliberately, with the least access it needs. You can see what's connected and switch any of it off.", "faq": [["What if our system isn't on the list?", "Most internal and external systems can be connected one way or another, through a ready-made connector, an integration platform or an export. More complex integrations are an optional extra."]]}, "autopilot": {"name": "Autopilot", "tag": "Runs on a schedule", "short": "Skills run on a schedule and write what they produce back into the knowledge base. So your brief is ready at seven, and the system keeps itself up to date.", "points": ["Scheduled runs, overnight and through the day", "Results filed back into what it records", "The system keeps itself current"], "model": "Autopilot circles above everything. Each pulse starts a skill, and the result drops down into the knowledge base as a new record.", "how": "Scheduled tasks run skills at set times: the brief at seven, an email pass during the day, the day filed in the evening. Each run reads the latest information, does its job and files the result.", "examples": ["07:00 morning brief", "Email triage through the day", "Weekly pipeline review", "Evening filing of the day's meetings and actions"], "control": "You set the schedule. Each run leaves a record, so you can see what ran and what it produced.", "faq": [["Does it act on its own?", "It prepares, drafts and files. Anything that goes out of the business waits for a person to check it."]]}}, "order": ["team", "platform", "knowledge", "skills", "dashboards", "connectors", "autopilot"], "groups": [["Who it's for", ["team"]], ["The foundation", ["platform"]], ["The four parts", ["knowledge", "skills", "dashboards", "connectors"]], ["On top", ["autopilot"]]], "tour": [[null, "Most people use AI the same way. Open a chat, explain the background, get a decent answer, close the tab. Tomorrow, they start again."], ["platform", "A Business AI Operating System changes that. It's a way of setting up the AI you already use, on platforms including Claude, ChatGPT and Copilot, so it works like part of your team."], ["knowledge", "First, a knowledge base. What it knows: your company, your team and how you like things done. What it records: meetings, decisions and proposals. And it stays on your own cloud drive."], ["skills", "Second, skills, which many people call agents. A daily brief, meeting write-ups, and a few built around the work that fills most of your week."], ["dashboards", "Third, dashboards. What's on, what's slipping, and what to do about it."], ["connectors", "Fourth, connectors. Your files, email and calendar from day one. Your CRM, finance and other systems when you're ready."], ["autopilot", "Then comes autopilot. Skills run on a schedule and write what they produce back into the knowledge base. So your brief is ready at seven."], ["team", "And it's there for you and your team, in one app, on your PC, your Mac or your phone."], [null, "Knowledge, skills, dashboards and connectors, with autopilot on top. Hours back every week, a team working from the same picture, and AI use you can see and control."]], "scene": {"platformNames": "Claude Cowork   ·   ChatGPT for Work   ·   Microsoft Copilot 365", "knows": "Your company and market  ·  Your team, roles and processes  ·  You: your style and priorities", "records": "Meetings and decisions  ·  Proposals, plans, campaigns  ·  Customers, tasks, progress", "storage": "SharePoint  ·  OneDrive  ·  Google Workspace", "agents": [{"name": "Knowledge management", "kind": "std", "time": "06:30 Knowledge filed"}, {"name": "Meeting write-ups", "kind": "std", "time": "11:30 Meeting write-up"}, {"name": "Daily brief", "kind": "std", "time": "07:00 Morning brief"}, {"name": "Proposals", "kind": "role", "time": "14:00 Proposal draft"}, {"name": "Board reports", "kind": "role", "time": "16:00 Board pack"}, {"name": "Add your own", "kind": "ghost", "time": ""}], "connectors": [{"name": "Files", "live": true}, {"name": "Email", "live": true}, {"name": "Calendar", "live": true}, {"name": "CRM", "live": false}, {"name": "Finance", "live": false}, {"name": "And many more", "live": false}], "optionalLabel": "Optional: CRM, finance and most other systems", "dashFn": "Built for your function", "dashStd": "Standard set"}}, "benefits": {"intro": {"eyebrow": "What it does for you", "h1": "What would you do with an extra day a week?", "lead": "Think about how much of your week goes on gathering information, chasing updates, and starting documents from a blank page. Here's what a working day looks like for a senior leader with a Business AI Operating System."}, "dayTitle": "One leader's day", "dayHint": "Click a moment, play the day, or switch to Without to see the same day the old way.", "withoutTag": "without an AIOS", "orgTitle": "Across the business", "orgIntro": "This is one leader's day. The same thing happens right across the business, with each team working with AI that knows their part of it.", "gainTitle": "The gain is more than speed", "gainText": "Because everything draws on what the business knows, the work is more consistent and higher quality. That frees up time for customers, and for the decisions that need a human touch.", "settings": ["Kitchen table", "Client meeting", "At the desk", "Boardroom", "Open office", "Home"], "lateSetting": "Still at the desk", "stops": [{"id": "brief", "time": "07:00", "hour": 7, "title": "The morning brief is ready", "agent": 2, "parts": ["autopilot", "skills", "connectors", "knowledge", "dashboards", "team"], "script": "At seven, the morning brief is ready. Overnight, the system has read the email, the calendar, the CRM, the finance system and the support queue. It hasn't just collected the numbers. It's worked out what they mean.", "short": "Overnight, the system has read the email, the calendar, your task list, the CRM, the finance system and the support queue. It hasn't just collected the numbers. It's worked out what they mean, and what needs doing today.", "did": ["Read the overnight email, today's calendar, your task list and the latest figures", "Checked what's due or overdue on the task list, and what's moved since yesterday", "Compared them with what it knows about your customers and plans", "Picked out what needs you: two customer issues, cash collection behind plan, and today's client up for renewal"], "gain": "You start the day knowing what matters, instead of spending the first hour finding out.", "model": "Autopilot starts the daily brief agent before you're up. It reads through the connectors, and the brief lands on the morning brief dashboard and on your phone.", "how": "The daily brief is a scheduled skill. It runs at a set time, reads your connected systems, your task list and the knowledge base, and writes a short brief in the format you've chosen, with today's priorities drawn from the tasks that are due. Because it knows your customers, your targets and your priorities, it can say why something matters, not just that it changed.", "without": "An hour across email, the CRM and the finance system, piecing the picture together yourself.", "withit": "A few minutes with a brief that has already done the reading and flagged the three things that need you.", "plot": 0, "hand": "The morning brief", "scene": "Before dawn the AI teammates are already at work. As the leader reaches the kitchen table, one walks over with the morning brief."}, {"id": "meeting", "time": "09:30", "hour": 9.5, "title": "Before and after the client meeting", "agent": 1, "parts": ["skills", "knowledge", "connectors", "team"], "script": "Before the client meeting, there's a briefing on the account. Afterwards, the write-up goes well beyond notes. The CRM is updated, the actions are filed, and a follow-up email is drafted, ready to check and send.", "short": "Before the meeting, there's a briefing on the account. Afterwards, the write-up goes well beyond notes. It's written with the context of the customer and the business, with analysis of what was said and what it means.", "did": ["Prepared an account briefing from the history, recent emails and open issues", "Wrote up the meeting from the transcript, with decisions, actions and what they mean", "Updated the CRM, filed the actions and drafted the follow-up email for you to check and send"], "gain": "Better prepared for every meeting, and no evening spent writing it up.", "model": "The meeting write-up agent works from the transcript and the customer's records, then files everything back into what the knowledge base records.", "how": "The meeting skill works from the transcript your meeting tool already produces, such as Teams, Zoom or Google Meet, or a voice recording on your phone for in-person meetings. The value is the context: it knows the customer, the history and your plans, so the write-up says what the meeting means for the account.", "without": "Notes typed up late, actions in someone's notebook, and the CRM updated when someone remembers.", "withit": "A write-up, CRM update, filed actions and a draft follow-up, ready soon after the call ends.", "plot": 1, "hand": "Briefing, then the write-up", "scene": "At the client meeting, an AI teammate brings the account briefing. Afterwards the write-up and the follow-up are taken care of."}, {"id": "proposal", "time": "11:30", "hour": 11.5, "title": "A proposal arrives for review", "agent": 3, "parts": ["skills", "knowledge", "team"], "script": "Late morning, a customer proposal arrives for review. The sales team built it with the AI, from the account history and the company's own standards. The leader adds judgement where it counts.", "short": "The sales team built the proposal with the AI, from the account history and the company's own standards. The leader adds judgement where it counts.", "did": ["Drafted the proposal from the account history, pricing rules and past winning proposals", "Applied the company's format, tone and terms", "Left the commercial judgement to the people who own it"], "gain": "Sales, leadership and AI working together on a stronger proposal, in a fraction of the time.", "model": "The proposals agent draws on what the knowledge base knows, your standards and pricing, and what it records about the account.", "how": "The proposal skill is built around how your organisation writes proposals: your structure, pricing rules, terms and examples of strong past work. The team starts from a solid first draft and spends its time on the parts that need human judgement.", "without": "Days assembling a proposal from old documents, with formatting and pricing errors to catch.", "withit": "A consistent first draft in your standards, so review time goes on the approach and the price.", "plot": 2, "hand": "The proposal draft", "scene": "At the desk, the sales team bring the proposal they drafted with an AI teammate. The leader adds the judgement."}, {"id": "board", "time": "14:00", "hour": 14, "title": "The board presentation", "agent": 4, "parts": ["skills", "dashboards", "connectors", "knowledge"], "script": "After lunch, the board presentation. The first draft pulls the latest figures from finance and the pipeline, in the company's format and tone. The time goes on the story and the recommendations.", "short": "The first draft pulls the latest figures from finance and the pipeline, in the company's format and tone. The time goes on the story and the recommendations.", "did": ["Pulled the latest figures from the finance system and the pipeline", "Built the first draft in the company's board format and tone", "Highlighted what has changed since the last board meeting"], "gain": "Time spent on the story and the recommendations, not on assembling slides.", "model": "The board reports agent draws figures through the connectors and from the dashboards, in the format the knowledge base holds.", "how": "The reporting skill knows your board format, the measures you report on and how you like them explained. It pulls current figures through the connectors and writes a first draft with the commentary started.", "without": "Days chasing numbers and rebuilding last quarter's slides.", "withit": "A current, consistent first draft, so the work goes into what the board needs to decide.", "plot": 3, "hand": "The board pack", "scene": "In the boardroom, the board pack arrives with the latest figures already in. The time goes on the story."}, {"id": "deal", "time": "16:00", "hour": 16, "title": "A deal starts to slip", "agent": null, "parts": ["dashboards", "connectors", "team"], "script": "Mid-afternoon, the dashboard flags a deal that's slipping, and suggests the next step.", "short": "The dashboard flags a deal that's slipping, and suggests the next step.", "did": ["Noticed the deal had gone quiet against its expected timeline", "Checked the account history for what's happened", "Suggested a next step and drafted the outreach"], "gain": "Problems found while there's still time to act on them.", "model": "Watch the red bar on the pipeline dashboard. The dashboards draw on everything, which is why they stand on the platform.", "how": "Dashboards are refreshed from the knowledge base and your connected systems. Because the AI builds them, they can explain why something is flagged and suggest what to do about it.", "without": "The slipping deal is spotted at the end-of-month review, when it's too late.", "withit": "A flag the same afternoon, with the reason and a suggested next step.", "plot": 4, "hand": "A flag and a next step", "scene": "The pipeline screen shows a deal in red. An AI teammate brings the flag and a suggested next step."}, {"id": "evening", "time": "18:30", "hour": 18.5, "title": "The day is filed", "agent": 0, "parts": ["autopilot", "skills", "knowledge"], "script": "By the evening, the day is filed, ready for tomorrow's brief.", "short": "By the evening, the day is filed, ready for tomorrow's brief.", "did": ["Filed the day's meetings, decisions and actions in the right places", "Updated customer records and task lists", "Got everything ready for tomorrow's brief"], "gain": "A system that keeps itself up to date, so tomorrow starts where today left off.", "model": "Autopilot runs the knowledge management agent, and the day's work drops into what the knowledge base records.", "how": "The knowledge management skill runs on a schedule. It files new material in the right place and keeps the records tidy, which is what makes every other skill better the next day.", "without": "Information scattered across inboxes, notebooks and people's heads.", "withit": "One up-to-date picture the whole team works from.", "plot": 5, "hand": "The day, filed", "scene": "The day has been filed, the laptop is closed, and the leader is home. The lamp is on."}], "lateStop": {"id": "late", "time": "20:30", "hour": 20.5, "title": "Still at the desk", "agent": null, "script": "At half past eight the leader is back at the desk, writing up the client meeting and chasing tomorrow's numbers.", "short": "At half past eight the leader is back at the desk, writing up the client meeting and chasing tomorrow's numbers.", "how": "Without a system that files the day as it goes, the admin waits until the real work is done. It happens late, it happens tired, and some of it doesn't happen at all.", "without": "At half past eight the leader is back at the desk, writing up the client meeting and chasing tomorrow's numbers. Little of the day is filed.", "withit": "The day files itself as it goes, and the leader is home by 18:30.", "plot": 2}, "depts": [{"id": "sales", "name": "Sales", "intro": "More time with customers, less time on admin.", "skills": ["Account research", "Proposal drafting"], "dash": "Pipeline and deals at risk", "systems": "Optional: CRM, such as HubSpot or Salesforce", "uses": [{"t": "A briefing before every call", "s": "Account history, recent emails, open issues and relevant news, on one page before each meeting.", "d": "The account research skill brings together what the knowledge base records about the customer with recent emails and the CRM. Sellers walk in prepared, without the half hour of digging.", "parts": ["skills", "knowledge", "connectors"]}, {"t": "Proposals in your standards", "s": "First drafts built from the account history, your pricing rules and past winning proposals.", "d": "The team starts from a consistent first draft and puts its effort into the approach and the price. Leaders review a better proposal, sooner.", "parts": ["skills", "knowledge"]}, {"t": "A pipeline that stays current", "s": "The CRM updated from meeting write-ups, and slipping deals flagged with a next step.", "d": "Meeting write-ups update the CRM, so the pipeline reflects reality. The dashboard flags deals that have gone quiet and suggests what to do.", "parts": ["dashboards", "connectors", "skills"]}]}, {"id": "marketing", "name": "Marketing", "intro": "Consistent content in your voice, and a clear view of what's working.", "skills": ["Content drafting", "Campaign reporting"], "dash": "Campaign performance", "systems": "Optional: marketing and analytics platforms", "uses": [{"t": "Content in your voice", "s": "Posts, articles and newsletters drafted from your brand voice and your own expertise.", "d": "The content skill knows your tone, your audience and what you've published before, so drafts sound like you and build on past work rather than repeating it.", "parts": ["skills", "knowledge"]}, {"t": "Campaign planning and reporting", "s": "Plans built from what worked before, and results reported in plain English.", "d": "Campaign results are pulled together from your platforms and explained: what worked, what didn't, and what to change next time.", "parts": ["skills", "dashboards", "connectors"]}, {"t": "Market and competitor watch", "s": "A regular summary of what's changing in your market and what competitors are saying.", "d": "A scheduled skill gathers and summarises market news and competitor activity, and files it so the whole team works from the same picture.", "parts": ["autopilot", "skills", "knowledge"]}]}, {"id": "operations", "name": "Operations", "intro": "Projects and processes that run without constant chasing.", "skills": ["Project status", "Process runbooks"], "dash": "Delivery and open issues", "systems": "Optional: project and work-tracking tools", "uses": [{"t": "Project status without chasing", "s": "Status pulled from meetings, emails and trackers into one weekly view.", "d": "Rather than asking everyone for updates, the system assembles status from what's already been recorded and flags what's late or at risk.", "parts": ["skills", "dashboards", "connectors"]}, {"t": "Processes kept current", "s": "Standard procedures written up and kept up to date as the work changes.", "d": "Runbooks live in the knowledge base. When a process changes, the update is made once and every skill that relies on it uses the new version.", "parts": ["knowledge", "skills"]}, {"t": "Issues triaged early", "s": "New issues sorted, routed and summarised before they escalate.", "d": "Incoming issues are matched against known problems and routed to the right person, with the history attached.", "parts": ["skills", "connectors", "dashboards"]}]}, {"id": "finance", "name": "Finance", "intro": "Numbers that arrive in time to act on, with the story attached.", "skills": ["Month-end pack", "Cash and collections"], "dash": "Cash, budget and forecast", "systems": "Optional: finance systems, such as Xero, QuickBooks or Sage", "uses": [{"t": "Month-end and board packs", "s": "First drafts of the management pack, with the commentary started.", "d": "Figures come through the finance connector into your standard format, with variances explained in plain English, ready for the finance lead to review.", "parts": ["skills", "connectors", "knowledge"]}, {"t": "Cash collection follow-ups", "s": "Overdue invoices spotted, and follow-up emails drafted for a person to send.", "d": "The system tracks what's overdue against your terms and the customer relationship, and drafts the right message for each case.", "parts": ["skills", "connectors", "dashboards"]}, {"t": "Budget questions answered", "s": "Ask a question of the numbers and get an answer with the working shown.", "d": "Because the figures and the context sit together, leaders can ask why a cost moved and get an explained answer, not just a spreadsheet.", "parts": ["knowledge", "connectors"]}]}, {"id": "hr", "name": "HR", "intro": "Less admin around people, so more time for the people themselves.", "skills": ["Recruitment admin", "Policy answers"], "dash": "People and recruitment", "systems": "Optional: HR and recruitment systems", "uses": [{"t": "Recruitment admin", "s": "Job adverts, candidate emails and interview packs prepared. People make every decision.", "d": "The system handles the paperwork around hiring, from adverts to scheduling and document checks. It never scores or chooses candidates. That stays with your people.", "parts": ["skills", "connectors"]}, {"t": "Policy questions answered", "s": "Staff questions answered from your own policies, with the source quoted.", "d": "Answers come from your policy documents in the knowledge base, with the section cited so anyone can check them.", "parts": ["knowledge", "skills"]}, {"t": "Onboarding that's ready on day one", "s": "Induction plans and welcome packs prepared for each new joiner.", "d": "New joiners get a tailored plan and access to the team's knowledge from their first day.", "parts": ["skills", "knowledge", "team"]}]}, {"id": "legal", "name": "Legal and compliance", "intro": "Obligations tracked and documents reviewed, with lawyers making the calls.", "skills": ["Contract review", "Obligation tracking"], "dash": "Contracts and obligations", "systems": "Optional: document and contract management", "uses": [{"t": "First-pass contract review", "s": "Contracts checked against your playbook, with deviations flagged.", "d": "The review skill compares each contract with your standard positions and highlights what needs attention, so legal time goes on the clauses that matter.", "parts": ["skills", "knowledge"]}, {"t": "Obligations and renewals tracked", "s": "Deadlines, renewals and obligations kept in one register, with reminders.", "d": "Key dates are taken from contracts into the knowledge base and shown on the dashboard before they're due.", "parts": ["knowledge", "dashboards", "autopilot"]}, {"t": "Regulation in plain English", "s": "Summaries of new rules and what they mean for your organisation.", "d": "Changes are summarised against your own policies, so it's clear what needs to change and who owns it.", "parts": ["skills", "knowledge"]}]}, {"id": "service", "name": "Customer service", "intro": "Faster, more consistent answers, and problems spotted early.", "skills": ["Reply drafting", "Issue patterns"], "dash": "Service queue and trends", "systems": "Optional: help desk, such as Zendesk or Freshdesk", "uses": [{"t": "Replies drafted from what you know", "s": "Answers drafted from your knowledge base and the customer's history, for an agent to check and send.", "d": "Agents start from a draft that already uses the right policy and the customer's history, so replies are faster and more consistent.", "parts": ["skills", "knowledge", "connectors"]}, {"t": "Recurring issues spotted early", "s": "Patterns across tickets flagged before they become a wave.", "d": "The system groups similar issues and flags trends on the dashboard, so the cause can be fixed rather than the symptoms answered.", "parts": ["dashboards", "skills"]}, {"t": "Knowledge that writes itself", "s": "Solved cases turned into help articles and internal guidance.", "d": "Good answers are captured as articles in the knowledge base, so the next person, or the next customer, finds them first.", "parts": ["knowledge", "skills"]}]}], "tour": {"intro": "What would you do with an extra day a week? Think about how much of your week goes on gathering information, chasing updates, and starting documents from a blank page.", "introWithout": "Here is the same day without a Business AI Operating System.", "org": "This is one leader's day. The same thing is happening right across the business. Sales, marketing, operations, finance, HR, legal and customer service, each working with AI that knows their part of the business.", "outro": "And the gain is more than speed. Because everything draws on what the business knows, the work is more consistent and higher quality. That frees up time for customers, and for the decisions that need a human touch.", "outroWithout": "Same leader, same work, and a much longer day. Switch to With to see the day given back."}}, "how": {"intro": {"eyebrow": "How you get one", "h1": "Built with you, on the platform you already use", "lead": "Human-AI Systems builds your Business AI Operating System with you, then trains your team to run it and keep improving it. Here's what working together looks like."}, "outcomes": ["A working AIOS, in your own accounts", "A team that can run and improve it", "A clear view of the time it gives back"], "stages": [{"id": "discovery", "name": "Discovery", "tag": "We learn how you work", "short": "We learn how your organisation works: the people, the processes, the work that fills the week and the systems you use. Together we agree what to build first.", "we": ["A discovery workshop with your leadership and key people", "A review of the material you already have", "Map your workflows and pick the highest-value ones", "Agree what's shared, the governance, and how success will be measured"], "you": ["Share company material: services, processes, templates and examples of strong work", "Give time from the people who know the work"], "get": ["An agreed design: the knowledge base, the skills, the dashboards and the connectors", "A baseline, so the time it gives back can be measured"], "model": "Your consultant runs a discovery workshop with your leadership. The whiteboard fills with your workflows and priorities.", "faq": [["Do we need to have done anything with AI already?", "No. Discovery starts from how you work today, whatever your experience with AI."], ["Do we need to share confidential information?", "No. You share as much as you're comfortable with, under an NDA. Later, the system connects to your own knowledge base, so it gains a deeper understanding of your business without that material ever being shared with Human-AI Systems."]]}, {"id": "build", "name": "Build", "tag": "We build your AIOS", "short": "We build your Business AI Operating System on the platform you already use: the knowledge base from your material, the standard skills tuned to you, skills built around your roles, and your dashboards.", "we": ["Build the knowledge base from your material and discovery", "Set up the standard skills and tune them to your organisation", "Build skills around your highest-value work", "Set up the standard dashboards and those for your functi eement and confidentiality agreement."]]}, {"id": "train", "name": "Train", "tag": "Your team learns to run it", "short": "We train you and your team to use it, manage it and keep improving it, so it doesn't depend on us. Training is typically a 60 to 90 minute session once a week for a few weeks, with a strong emphasis on learning by doing.", "we": ["Weekly sessions of 60 to 90 minutes, for a few weeks", "Learning by doing, on your own real work", "How to keep the knowledge base current, and change or add skills", "On site or online, to fit around your team"], "you": ["Take part in the sessions and practise on real work", "Nominate someone to own the system day to day"], "get": ["A team that runs the system and keeps improving it", "Guides and runbooks for the common tasks"], "model": "Your consultant trains the team from the side of the room. Each person learns to work with their AI teammate, and the system no longer depends on us.", "faq": [["Could we do it in one training day instead?", "We can, but we don't recommend it, because people keep far less from a single day. We'll fit the format to what works for you."], ["How technical does my team need to be?", "Not at all. If they can write a clear email, they can learn to improve a skill."]], "why": "People remember far more when they learn on their own work, a step at a time over a few weeks, than from one big training day. We're flexible, though: sessions fit around your diary, on site or online."}, {"id": "extend", "name": "Extend", "tag": "Optional, when you're ready", "short": "When you're ready, we can take it further: more complex workflows, more of your systems connected, and purpose-built agents with specialist partners.", "we": ["Connect further systems, such as CRM, finance or sector tools", "Build more complex, multi-step workflows", "Design purpose-built agents, with specialist delivery partners where needed", "Ongoing support and reviews, if you want them"], "you": ["Decide what's worth extending, ba   const total = widths.reduce((a, b) => a + b, 0);

  const w = state.b.without;
  const H = w ? [6, 7, 9.5, 11.5, 14, 16, 20.5, 22] : [6, 7, 9.5, 11.5, 14, 16, 18.5, 19.6];

  if (h <= H.at(0)) return U.at(0);

}

const SKY_NIGHT = new THREE.Color(0x0e1a30), SKY_DAWN = new THREE.Color(0x3a2a40), SKY_DAY = new THREE.Color(0x1f3a5f), skyC = new THREE.Color();

  sunH += (sunGoal - sunH) * (reduced ? 1 : 1 - Math.pow(0.12, dt));

  else { const near = PLOTS.reduce((b, p) => p.s.distanceTo(pos) < b.s.distanceTo(pos) ? p : b); if (near.s.distanceTo(pos) < 0.6) leader.g.rotation.y += (Math.atan2(near.cx - pos.x, 0.0001) - leader.g.rotation.y) * 0.1; }

  leader.arms.at(0).rotation.x = -swing * 0.6; leader.arms.at(1).rotation.x = swing * 0.6;

}

    a.padMat.emissiveIntensity = (a.kind === "ghost" ? 0.05 : 0.12) + a.flash * 0.9;
    if (a.bodyMat.emissiveIntensity !== undefined) a.bodyMat.emissiveIntensity = 0.25 + a.flash * 0.6;
    if (a.card) a.card.position.y = 1.05 + Math.sin(clock * 1.6 + a.phase) * 0.05 * motion;
  });
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t = Math.min(1, f.t + dt * 0.9);
    const e = f.t < 0.5 ? 2 * f.t * f.t : 1 - Math.pow(-2 * f.t + 2, 2) / 2;
    f.m.position.lerpVectors(f.start, f.end, e); f.m.position.y += Math.sin(f.t * Math.PI) * 1.4;
    f.m.rotation.x = -e * Math.PI / 2;
    f.m.material.opacity = Math.min(partFade.skills, partFade.knowledge) * (f.t > 0.9 ? (1 - f.t) * 10 : 1);
    if (f.t >= 1) { landRecord(f.end); scene.remove(f.m); f.m.geometry.dispose(); f.m.material.dispose(); flyers.splice(i, 1); }
  }
  for (let i = transients.length - 1; i >= 0; i--) {
    const tr = transients[i]; tr.life -= dt / tr.dur;
    if (tr.kind === "ripple") tr.obj.scale.setScalar(1 + (1 - tr.life) * 1.8);
    tr.obj.material.opacity = Math.max(0, tr.life) * partFade[tr.part];
    if (tr.life <= 0) { scene.remove(tr.obj); tr.obj.geometry.dispose(); tr.obj.material.dispose(); transients.splice(i, 1); }
  }
  if (!pulseLabel.el.hidden && now > pulseUntil) pulseLabel.el.hidden = true;
  pulseLabel.el.style.opacity = Math.min(1, partFade.skills + 0.1);

  dayTick(dt, now, motion);
  howTick(dt, now, motion);

  if (clock > nextScreen) {
    screens[0].vals = screens[0].vals.map((v, i) => i === 3 ? Math.max(0.15, v - 0.04 * motion) : Math.min(0.95, Math.max(0.25, v + (Math.random() - 0.45) * 0.12 * motion)));
    if (screens[0].vals[3] <= 0.16) screens[0].vals[3] = 0.6;
    screens.forEach(drawScreen); nextScreen = clock + 1.3;
  }

  renderer.render(scene, camera);
  placeLabels();

  if (tour.on && !tour.paused) {
    const talking = voice.playing && !voice.ended;
    if (talking) {
      const a = voice.audio; document.getElementById("tourProg").style.width = (a.duration ? Math.min(100, a.currentTime / a.duration * 100) : 0) + "%";
    } else {
      tour.t += dt;
      if (!voice.playing) document.getElementById("tourProg").style.width = Math.min(100, tour.t / tour.dur * 100) + "%";
      if (voice.playing ? performance.now() - voice.endAt >= voice.gap * 1000 : tour.t >= tour.dur) { if (tour.i < tour.steps.length - 1) { tour.i++; showTourStep(); } else stopTour(true); }
    }
  }
  requestAnimationFrame(frame);
}

resize();
setLens(LENSES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "benefits", true);
canvas.style.cursor = "grab";
requestAnimationFrame(frame);
// repaint surface text once the brand font has loaded
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { screens.forEach(drawScreen); TEXTS.forEach(x => { x.ctx.clearRect(0, 0, x.w, x.h); x.draw(x.ctx, x.w, x.h); x.t.needsUpdate = true; }); });
</script>
